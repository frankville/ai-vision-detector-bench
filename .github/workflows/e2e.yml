name: CPU end-to-end

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HOME: /tmp/visionbench-hf
      E2E_MODEL_REVISION: 066438d3d8f0da137a37b38fdf3368fd4afceced
      VISIONBENCH_E2E_ARTIFACTS: out/test-artifacts/e2e
      VISIONBENCH_EXPECT_WHEEL: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/e2e.txt
      - name: Build and install wheel with CPU dependencies
        run: |
          python -m pip install -r requirements/e2e.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          wheel, = Path('dist').glob('*.whl')
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', f'{wheel}[dev]'], check=True)
          PY
          python -m pip check
          mkdir -p out/test-artifacts
          python -m pip freeze --all > out/test-artifacts/dependencies.txt
      - name: Stage registered model
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          revision = os.environ['E2E_MODEL_REVISION']
          snapshot = Path(snapshot_download('ustc-community/dfine-nano-coco', revision=revision, allow_patterns=['*.json', 'model.safetensors']))
          assert snapshot.name == revision
          Path('out/test-artifacts/checkpoint.txt').write_text(revision + '\n')
          print(f'Checkpoint snapshot: {snapshot}')
          PY
      - name: Test installed CLI on CPU
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m pytest tests/e2e -m e2e --run-e2e --junitxml=out/test-artifacts/e2e.xml
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-e2e
          path: out/test-artifacts/
          retention-days: 7
