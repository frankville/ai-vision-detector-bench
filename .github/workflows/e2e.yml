name: CPU end-to-end

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HOME: /tmp/visionbench-hf
      VISIONBENCH_E2E_ARTIFACTS: out/test-artifacts/e2e
      VISIONBENCH_EXPECT_WHEEL: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and install wheel with CPU dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip wheel --no-deps . --wheel-dir dist
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          wheel, = Path('dist').glob('*.whl')
          subprocess.run([sys.executable, '-m', 'pip', 'install', f'{wheel}[dev]'], check=True)
          PY
      - name: Stage registered model
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot = snapshot_download('ustc-community/dfine-nano-coco', allow_patterns=['*.json', 'model.safetensors'])
          print(f'Checkpoint snapshot: {snapshot}')
          PY
      - name: Test installed CLI on CPU
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m pytest tests/e2e -m e2e --run-e2e --junitxml=out/test-artifacts/e2e.xml
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-e2e
          path: out/test-artifacts/
          retention-days: 7
